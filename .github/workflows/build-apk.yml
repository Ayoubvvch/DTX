name: Build DTX Pure Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DTX APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/DTX-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTX-v1.0.0-APK
          path: release-output/DTX-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "DTX v1.0.0 - System Architecture Android Edition"
          body: |
            ### ⚡ DTX: System Architecture Android APK (v1.0.0)

            - **High-Performance Standalone Android APK:**
              - Clean, ultra-lightweight APK package.
              - AMOLED Void dark theme `#030303` with matching system status and navigation bars.
            - **Secure Origin Assets & Modern Web Engine:**
              - Built with `WebViewAssetLoader` serving local assets from `https://appassets.androidplatform.net/`.
              - Full ES Modules support, Firebase Realtime Sync & Anonymous Auth.
            - **Native Device Features:**
              - Hardware-accelerated GPU layer with instant startup.
              - Audio engine playback enabled (Struggler theme).
              - Double back-tap navigation.
          files: release-output/DTX-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
